<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- DotClaude icon: a dot-file sheet (folded corner) with a bold dot, on a terracotta squircle. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2622B"/>
      <stop offset="1" stop-color="#9A330A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185" ry="185"/></clipPath>
    <filter id="tile" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#tile)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#body)"/>
  </g>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="104" y="104" width="816" height="816" rx="181" ry="181" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="8"/>
  <g filter="url(#drop)">
    <!-- sheet with folded top-right corner -->
    <path d="M330 250 H600 L720 370 V734 Q720 774 680 774 H330 Q290 774 290 734 V290 Q290 250 330 250 Z" fill="#FBF6F1"/>
    <path d="M600 250 V330 Q600 370 640 370 H720 Z" fill="#E9C9B5"/>
    <!-- three "config lines" -->
    <rect x="362" y="420" width="220" height="34" rx="17" fill="#E9C9B5"/>
    <rect x="362" y="490" width="290" height="34" rx="17" fill="#E9C9B5"/>
    <!-- the dot -->
    <circle cx="430" cy="640" r="70" fill="#C2410C"/>
  </g>
</svg>
